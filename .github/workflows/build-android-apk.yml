name: Build Aroma Ceylon Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'android/**'
      - 'scripts/**'
      - 'package.json'
      - 'vite.config.ts'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Validate Supabase build settings
        shell: bash
        run: |
          test -n "$VITE_SUPABASE_URL" || (echo "Missing GitHub secret: VITE_SUPABASE_URL" && exit 1)
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || (echo "Missing GitHub secret: VITE_SUPABASE_PUBLISHABLE_KEY" && exit 1)

      - name: Install web dependencies
        run: npm install --no-audit --no-fund

      - name: Build web app
        run: npm run build

      - name: Copy web build into Android app
        run: npm run android:prepare-assets

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle -p android assembleDebug --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Aroma-Ceylon-Android-Test.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: Aroma-Ceylon-Android-APK
          path: Aroma-Ceylon-Android-Test.apk
          if-no-files-found: error
          retention-days: 30
