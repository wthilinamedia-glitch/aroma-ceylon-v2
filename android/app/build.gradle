plugins {
    id 'com.android.application'
}

// Firebase configuration is injected by GitHub Actions from a repository secret.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

def signingStorePath = System.getenv('ANDROID_KEYSTORE_PATH')
def signingStorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
def signingKeyAlias = System.getenv('ANDROID_KEY_ALIAS')
def signingKeyPassword = System.getenv('ANDROID_KEY_PASSWORD')
def hasReleaseSigning = signingStorePath && signingStorePassword && signingKeyAlias && signingKeyPassword

android {
    namespace 'com.aromaceylon.business'
    compileSdk 35

    defaultConfig {
        applicationId 'com.aromaceylon.business'
        minSdk 26
        targetSdk 35
        versionCode 9
        versionName '1.2.6-test'
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(signingStorePath)
                storePassword signingStorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

// Never allow a GitHub release build to silently fall back to unsigned output.
gradle.taskGraph.whenReady { graph ->
    if (graph.hasTask(':app:assembleRelease') && !hasReleaseSigning) {
        throw new GradleException('Release signing secrets are missing. Refusing to build an unsigned Aroma Ceylon release APK.')
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:34.16.0')
    implementation 'com.google.firebase:firebase-messaging'
}
