plugins {
    id 'com.android.application'
}

// Firebase configuration is injected by GitHub Actions from a repository secret.
// Keeping the Google Services plugin conditional lets non-push test builds compile too.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

android {
    namespace 'com.aromaceylon.business'
    compileSdk 35

    defaultConfig {
        applicationId 'com.aromaceylon.business'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '1.2.1-test'
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:34.16.0')
    implementation 'com.google.firebase:firebase-messaging'
}
